repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: lint
        name: eslint
        entry: npx eslint
        language: system
        files: \.(ts|tsx)$
        pass_filenames: true

      - id: typecheck
        name: typecheck
        entry: npx tsc -b
        language: system
        pass_filenames: false
        always_run: true

      - id: test
        name: vitest
        entry: npx vitest run
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
